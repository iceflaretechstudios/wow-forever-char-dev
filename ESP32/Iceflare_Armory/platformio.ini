[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
board_build.filesystem = littlefs
; 4 MB flash: 1.875 MB app partitions, 128 KB LittleFS.
board_build.partitions = min_spiffs.csv
; Keep diagnostic and main applications separate.
build_src_filter =
  +<main.cpp>
  -<screen_test.cpp>
lib_deps =
  bodmer/TFT_eSPI@^2.5.43
  bblanchon/ArduinoJson@^7.4.1
  https://github.com/PaulStoffregen/XPT2046_Touchscreen.git
  bodmer/TJpg_Decoder@^1.1.0
build_flags =
  -D USER_SETUP_LOADED=1
  -D ST7796_DRIVER=1
  -D TFT_WIDTH=320
  -D TFT_HEIGHT=480
  -D SPI_FREQUENCY=27000000
  -D LOAD_GLCD=1
  -D LOAD_FONT2=1
  -D LOAD_FONT4=1
  -D SMOOTH_FONT=0
  -D TFT_MISO=12
  -D TFT_MOSI=13
  -D TFT_SCLK=14
  -D TFT_CS=15
  -D TFT_DC=2
  -D TFT_RST=-1

; Hardware-only test for the LCDWIKI E32R40T-compatible board.
; Does not compile the Armory application or connect to Wi-Fi.
[env:screen_test]
extends = env:esp32dev
build_src_filter =
  -<main.cpp>
  +<screen_test.cpp>
build_flags =
  -D USER_SETUP_LOADED=1
  -D ST7796_DRIVER=1
  -D TFT_WIDTH=320
  -D TFT_HEIGHT=480
  -D TFT_MISO=12
  -D TFT_MOSI=13
  -D TFT_SCLK=14
  -D TFT_CS=15
  -D TFT_DC=2
  -D TFT_RST=-1
  -D SPI_FREQUENCY=27000000
  -D SPI_READ_FREQUENCY=16000000
  -D LOAD_GLCD=1
  -D LOAD_FONT2=1
  -D LOAD_FONT4=1
